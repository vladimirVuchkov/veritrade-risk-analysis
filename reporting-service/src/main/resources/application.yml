server:
  port: 8083

spring:
  application:
    name: reporting-service
  datasource:
    url: ${REPORTING_DB_URL:jdbc:h2:file:./data/reporting}
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # A connection attempt to a stopped broker container can hang until this timeout (60 s by default).
    # It must stay well below Docker's 10 s stop grace period, or a shutdown during a broker outage is
    # killed and H2 can lose recently committed data.
    connection-timeout: 2s
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: true
          # Spring Boot 4.1 counts retries, not attempts: 2 retries = the 3 attempts of the contract.
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

reporting:
  # Contract maxLength values (UTF-16 units), equal to the column sizes in V1__init.sql.
  limits:
    rule-id-max-length: 32
    rules-version-max-length: 32
    matched-text-max-length: 500
    excerpt-max-length: 1000
    failure-reason-max-length: 1000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
