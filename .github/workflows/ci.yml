name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven verify (unit and Testcontainers integration tests)
        run: ./mvnw -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend tests
        run: node --test frontend/test/

  e2e:
    name: Compose smoke and chaos tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_WAIT_TIMEOUT_SECONDS: 300
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout "$COMPOSE_WAIT_TIMEOUT_SECONDS"

      - name: Smoke test
        run: scripts/smoke.sh

      - name: Chaos test
        run: scripts/chaos.sh

      - name: Service logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down -v
