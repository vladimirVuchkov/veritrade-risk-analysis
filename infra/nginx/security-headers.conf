# Security headers for every response. Included at server level and again in every location that
# sets its own add_header (nginx does not inherit add_header into such a location).
#
# Content-Security-Policy: the UI is index.html, styles.css and ES modules from js/, all same-origin,
# and calls only the same-origin /api. No inline script or style, no eval, no plugins, no framing,
# no <base> rewrite.
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
