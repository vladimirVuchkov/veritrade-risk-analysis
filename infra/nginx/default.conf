# Static UI + reverse proxy for the two external APIs. Included inside the http block of nginx.conf,
# which already includes mime.types (.js -> JavaScript MIME type, required by <script type="module">).

log_format veritrade '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time upstream=$upstream_addr cid="$http_x_correlation_id"';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout veritrade;

    root /usr/share/nginx/html;
    index index.html;

    # A filing may hold 2 MB of text; JSON escaping adds a little. The 1 MB default would answer 413
    # before Ingestion could validate the size and answer 400.
    client_max_body_size 3m;
    client_body_buffer_size 3m;

    # Docker's embedded DNS. Upstreams are resolved per request (variables in proxy_pass), so nginx
    # starts without the services and follows a restarted container to its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ingestion http://ingestion-service:8081;
    set $reporting http://reporting-service:8083;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;

    error_page 502 503 504 = @upstream_unavailable;
    error_page 413 = @payload_too_large;

    # The full URI, /api included, goes to the service (no URI part in proxy_pass).
    location /api/filings {
        proxy_pass $ingestion;
    }

    location /api/reports {
        proxy_pass $reporting;
    }

    location /api/ {
        default_type application/problem+json;
        return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"No API at this path."}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Only index.html, styles.css and js/ are in the image; anything else is a 404.
    location / {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ =404;
    }

    location @upstream_unavailable {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The service behind this path is not reachable. Try again shortly."}';
    }

    location @payload_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Payload Too Large","status":413,"detail":"The request body is larger than 3 MB."}';
    }
}
