server:
  port: 8081

spring:
  application:
    name: ingestion-service
  datasource:
    url: ${INGESTION_DB_URL:jdbc:h2:file:./data/ingestion}
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # A connection attempt to a stopped broker container can hang until this timeout (60 s by default).
    # It must stay well below Docker's 10 s stop grace period, or a shutdown during a broker outage is
    # killed and H2 can lose recently committed data.
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

ingestion:
  filing:
    max-content-bytes: 2097152
    max-company-name-length: 200
    max-title-length: 300
    max-failure-reason-length: 1000
  listing:
    default-limit: 20
    max-limit: 100
  correlation-id:
    max-length: 128
  outbox:
    enabled: true
    publish-interval: 500ms
    batch-size: 20
    confirm-timeout: 5s
