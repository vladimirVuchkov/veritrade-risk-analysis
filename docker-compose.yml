name: veritrade

x-java-service: &java-service
  restart: unless-stopped
  environment: &rabbit-env
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-veritrade}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-veritrade}
  depends_on:
    rabbitmq:
      condition: service_healthy
  networks: [backend]

services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-veritrade}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-veritrade}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  ingestion-service:
    <<: *java-service
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: ingestion-service
        PORT: 8081
    environment:
      <<: *rabbit-env
      INGESTION_DB_URL: jdbc:h2:file:/app/data/ingestion
    volumes:
      - ingestion-data:/app/data

  analysis-service:
    <<: *java-service
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: analysis-service
        PORT: 8082

  reporting-service:
    <<: *java-service
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: reporting-service
        PORT: 8083
    environment:
      <<: *rabbit-env
      REPORTING_DB_URL: jdbc:h2:file:/app/data/reporting
    volumes:
      - reporting-data:/app/data

volumes:
  rabbitmq-data:
  ingestion-data:
  reporting-data:

networks:
  backend:
