name: veritrade

# Only the UI (nginx) and the RabbitMQ management UI are published to the host, and only on
# BIND_ADDRESS (default 127.0.0.1, loopback). The services talk to each other on the single "backend"
# network.
#
# Credentials: without a .env the broker user is veritrade/veritrade, so `docker compose up --build`
# works with no manual step. That known password is accepted only on a loopback BIND_ADDRESS: the
# rabbitmq container then logs a WARNING, and it refuses to start when BIND_ADDRESS is any other
# address (see infra/rabbitmq/credentials-guard.sh). Set RABBITMQ_PASSWORD in .env to publish elsewhere.

x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 90s
  start_interval: 2s

x-java-service: &java-service
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
  networks: [backend]

x-rabbit-env: &rabbit-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-veritrade}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-veritrade}

services:
  rabbitmq:
    build:
      context: infra/rabbitmq
      dockerfile: ../docker/rabbitmq.Dockerfile
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-veritrade}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-veritrade}
      VERITRADE_BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 2s
    networks: [backend]

  ingestion-service:
    <<: *java-service
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: ingestion-service
        PORT: 8081
    environment:
      <<: *rabbit-env
      INGESTION_DB_URL: jdbc:h2:file:/app/data/ingestion
    volumes:
      - ingestion-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health > /dev/null || exit 1"]
      <<: *java-healthcheck

  analysis-service:
    <<: *java-service
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: analysis-service
        PORT: 8082
    environment:
      <<: *rabbit-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health > /dev/null || exit 1"]
      <<: *java-healthcheck

  reporting-service:
    <<: *java-service
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: reporting-service
        PORT: 8083
    environment:
      <<: *rabbit-env
      REPORTING_DB_URL: jdbc:h2:file:/app/data/reporting
    volumes:
      - reporting-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health > /dev/null || exit 1"]
      <<: *java-healthcheck

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-8080}:8080"
    depends_on:
      ingestion-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s
    networks: [backend]

volumes:
  rabbitmq-data:
  ingestion-data:
  reporting-data:

networks:
  backend:
