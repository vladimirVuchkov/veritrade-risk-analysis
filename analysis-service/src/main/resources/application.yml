server:
  port: 8082

spring:
  application:
    name: analysis-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          # Spring Boot 4 counts retries after the first attempt: 2 retries = the 3 attempts of the contract.
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

# Rule engine and publisher settings (veritrade.analysis.rules.*, veritrade.analysis.messaging.*)
# have their defaults in RulesProperties and MessagingProperties; override them here or by environment.

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
